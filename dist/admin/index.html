    <script>
      // Gracefully handle direct non-hash visits (e.g. /admin/listings -> /admin/#/listings)
      (function() {
        var p = window.location.pathname;
        if (p && p.startsWith('/admin/') && !window.location.hash) {
          var sub = p.replace(/^\/admin\/?/, '');
          if (sub) {
            window.location.replace('/admin/#/' + sub);
          }
        }
      })();
    </script>
